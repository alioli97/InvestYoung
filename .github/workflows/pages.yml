name: Pages

# Publishes site/ (privacy policy for the Google Play listing) to GitHub Pages:
# https://alioli97.github.io/InvestYoung/privacy/

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Refuse to publish placeholders
        run: |
          if grep -rn "CONTACT_EMAIL_PENDING" site/; then
            echo "::error::Set the contact email in site/ before publishing."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
